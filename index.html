<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PS4 Jailbreak — PSFree UI</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;background:#020711;overflow:hidden}
    body{
      font-family:Arial,Helvetica,sans-serif;
      color:#fff;
      background:#020711 url("bg.png") center/cover no-repeat fixed;
      position:relative;
    }
    /* Animated HUD layers over the artwork */
    body:before{
      content:"";
      position:absolute;inset:0;pointer-events:none;
      background:
        linear-gradient(115deg,transparent 0%,rgba(0,140,255,.05) 45%,rgba(0,190,255,.18) 50%,rgba(0,140,255,.05) 55%,transparent 100%);
      background-size:220% 100%;
      animation:sweep 7s linear infinite;
      mix-blend-mode:screen;
    }
    body:after{
      content:"";
      position:absolute;inset:0;pointer-events:none;
      background:repeating-linear-gradient(
        0deg,transparent 0,transparent 3px,rgba(0,150,255,.035) 4px,transparent 5px
      );
      animation:scan 4s linear infinite;
    }
    .hud{
      position:absolute;inset:0;pointer-events:none;
      background-image:
        radial-gradient(circle at 20% 30%,rgba(0,140,255,.16) 0 1px,transparent 2px),
        radial-gradient(circle at 70% 65%,rgba(0,190,255,.12) 0 1px,transparent 2px);
      background-size:90px 90px,130px 130px;
      animation:drift 14s linear infinite;
    }
    .notice{
      position:absolute;left:50%;bottom:18px;transform:translateX(-50%);
      padding:7px 14px;border:1px solid rgba(0,150,255,.35);
      border-radius:999px;background:rgba(0,8,20,.65);
      color:#79c8ff;font-size:12px;letter-spacing:.5px;
      backdrop-filter:blur(5px)
    }
    @keyframes sweep{to{background-position:-220% 0}}
    @keyframes scan{to{transform:translateY(5px)}}
    @keyframes drift{to{background-position:90px 90px, -130px -130px}}
    @media(max-width:700px){
      body{background-position:center top}
      .notice{font-size:10px;bottom:8px}
    }
  </style>
</head>
<body>
  <div class="hud"></div>
  <div class="notice">PS4 JAILBREAK • PSFree UI • Animated HUD Background</div>
</body>
</html>
